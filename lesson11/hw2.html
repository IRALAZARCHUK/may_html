    body{
        background-color: #fff;
        height: 200vh;
    }
    div{
        display: flex;
        justify-content: center;
        align-items: center;
        align-content: center;
        height: 100vh;
        animation: round linear infinite alternate;
    }
    @keyframes round {
        0%{
    transform: rotate(360degr);
    }
    100%{
        transform: rotate(0degr);
    }

    }
</style>
