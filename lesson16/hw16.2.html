<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .grid{
            display: grid;
            height: 100vh;
            grid-template-rows: 1.5fr 1fr 0.5fr 0.5fr 1fr 1.5fr;
            grid-template-columns: 2fr 1fr;
            grid-template-areas:
            "header header"
            "section nav"
            "address nav"
             "address aside"
            "main aside"
            "footer footer";
        }
        header{
            grid-area: header;
            background-color: #655d5d;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        section{
            grid-area: section;
            background-color: #828381;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        address{
            grid-area: address;
            background-color: #7c3e3e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        main{
            grid-area: main;
            background-color: #602323;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        nav{
            grid-area: nav;
            background-color: #886868;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        aside {
            grid-area: aside;
            background-color: #605454;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        footer {
            grid-area: footer;
            background-color: #776f6f;
            display: flex;
            justify-content: center;
            align-items: center;
        }

    </style>
</head>
<body>
<div class="grid">
    <header>
        <p>Header</p>
    </header>
    <section>Content-1</section>
    <address>Content-2</address>
    <main>Content-3</main>
    <nav>Spam-1</nav>
    <aside>Spam-2</aside>
    <footer>Footer</footer>
</div>
</body>
</html>
