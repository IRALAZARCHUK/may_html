<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: darkcyan;
        }
        div{
            width: 450px;
            height: 360px;
            background-color: white;
            border-radius: 15px;
        }
    </style>
</head>
<body>
<div>
    <header>Вхід в особистий кабінет</header>

        <label>Запам'ятати мене  <input type="checkbox" name="remember"></label>
        <input type="submit" value="Вхід">
    </form>
</div>

</body>
</html>
