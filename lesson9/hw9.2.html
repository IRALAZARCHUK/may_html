<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 200vh;
        }
        section{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        div{
            height: 120vh;
            width: 50vw;
            border: 2px solid #d6d5d5;
        }
        .inst{
            width: 400px;
            margin-left: 130px;
            margin-top: 60px;
            margin-bottom: 60px;
        }
        .inline{
            display: block;
            width: 400px;
            height: 50px;
            margin-top: 10px;
            margin-left: 130px;
            background-color: #edebeb;
            font-size: 16px;
            outline: none;
            border: 2px solid #d5d5d5;
        }
        .button{
            width: 400px;
            height: 50px;
            margin-top: 20px;
            margin-left: 130px;
            border-radius: 15px;
            outline: none;
            border: none;
            background-color: #62c0dc;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }
        .or{
            margin-top: 30px;
            font-size: 20px;
            font-weight: bold;
            color: #6B6666;
            margin-left: 310px;
            margin-bottom: 60px;
        }
        a{
            font-size: 20px;
            text-decoration: none;
            color: #446597;
        }
        .facebook{
            margin-left: 220px;
            height: 16px;
        }
        .pass{
            margin-left: 260px;
            margin-top: 40px;
        }
        .second{
            margin-top: 20px;
            height: 20vh;
            width: 50vw;
            border: 2px solid #d6d5d5;
        }
        .registr{
            font-size: 30px;
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>
<body>
<section>
<div>
    <img class="inst" src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/800px-Instagram_logo.svg.png"
         alt="inst">
    <form>
        <input class="inline" type="text" name="username" placeholder=" Номер телефону, ім'я користувача або електронна адреса">
        <input class="inline" type="password" name="password" placeholder=" Пароль">
        <input class="button" type="submit" value="Увійти">
    </form>
    <p class="or">АБО</p>
    <p class="facebook"><img src="img/facelogo.png" alt="facebooklogo"> <a href="hw9.2.html"> Увійти через Facebook</a></p>
    <p class="pass"><a href="hw9.2.html">Забули пароль</a></p>
</div>
</section>
<section>
    <div class="second" >
        <p class="registr">Не маєте облікового запису?<a class="registr" href="hw9.2.html"> Зареєструйтеся</a></p>
    </div>
</section>
</body>
</html>
